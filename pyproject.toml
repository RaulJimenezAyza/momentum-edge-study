[project]
name = "momentum-edge-study"
version = "0.1.0"
description = "A viral crypto momentum strategy, measured properly: paper-trading bot, walk-forward backtests and random-entry controls."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Raúl Jiménez Ayza" }]
dependencies = [
    "aiohttp>=3.9",
    "websockets>=12.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# ML filter only (run.py train / ml.enabled). The bot and the viewer run without these.
ml = ["numpy>=1.26", "scikit-learn>=1.4", "joblib>=1.3"]
# US equities via Yahoo Finance (run.py equities). Not needed for the Binance side.
equities = ["yfinance>=0.2.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["bot"]

[tool.setuptools.package-data]
bot = ["static/*.html"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
# zip(strict=True) would change behaviour on purpose-truncated pairs; not a lint fix.
ignore = ["B905"]
